name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # revnix-kmp is skipped: its iOS targets need a macOS runner.
      - name: Test and build
        run: ./gradlew :revnix-core:test :revnix-android:testReleaseUnitTest :revnix-android:assembleRelease
